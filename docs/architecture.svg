<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720" role="img" aria-label="Pactis Wallet architecture">
  <style>
    .title { font: 700 20px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0f172a; }
    .label { font: 600 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0f172a; }
    .sub { font: 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #334155; }
    .tiny { font: 11px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #475569; }
  </style>
  <rect width="920" height="720" fill="#f8fafc"/>
  <text x="460" y="36" text-anchor="middle" class="title">Pactis Wallet</text>
  <text x="460" y="58" text-anchor="middle" class="tiny">JWT auth · locking · idempotent ledger · Bull retries / DLQ</text>

  <rect x="360" y="78" width="200" height="44" rx="8" fill="#fff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="460" y="105" text-anchor="middle" class="label">Client</text>
  <line x1="460" y1="122" x2="460" y2="148" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="148" width="320" height="52" rx="8" fill="#1e293b" stroke="#0f172a"/>
  <text x="460" y="179" text-anchor="middle" class="label" fill="#f8fafc">NestJS REST API</text>

  <line x1="380" y1="200" x2="250" y2="248" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="540" y1="200" x2="670" y2="248" stroke="#0f172a" stroke-width="1.5"/>

  <rect x="140" y="248" width="220" height="64" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250" y="276" text-anchor="middle" class="label">Auth</text>
  <text x="250" y="296" text-anchor="middle" class="tiny">bcrypt · JWT · ownership</text>

  <rect x="560" y="248" width="220" height="64" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="670" y="276" text-anchor="middle" class="label">Wallet / Transactions</text>
  <text x="670" y="296" text-anchor="middle" class="tiny">optimistic · pessimistic · ledger</text>

  <line x1="250" y1="312" x2="250" y2="348" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="670" y1="312" x2="670" y2="348" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="250" y1="348" x2="670" y2="348" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="460" y1="348" x2="460" y2="378" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="250" y="378" width="420" height="88" rx="8" fill="#fff" stroke="#0f766e" stroke-width="1.8"/>
  <text x="460" y="408" text-anchor="middle" class="label">MySQL (source of truth)</text>
  <rect x="280" y="422" width="110" height="28" rx="4" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="335" y="441" text-anchor="middle" class="tiny">users</text>
  <rect x="405" y="422" width="110" height="28" rx="4" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="460" y="441" text-anchor="middle" class="tiny">wallets</text>
  <rect x="530" y="422" width="110" height="28" rx="4" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="585" y="441" text-anchor="middle" class="tiny">ledger</text>

  <line x1="340" y1="466" x2="250" y2="508" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="580" y1="466" x2="670" y2="508" stroke="#0f172a" stroke-width="1.5"/>

  <rect x="140" y="508" width="220" height="64" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="250" y="536" text-anchor="middle" class="label">In-process cache</text>
  <text x="250" y="556" text-anchor="middle" class="tiny">cache-aside · invalidate after commit</text>

  <rect x="560" y="508" width="220" height="64" rx="8" fill="#fff" stroke="#b45309" stroke-width="1.5"/>
  <text x="670" y="536" text-anchor="middle" class="label">Redis + Bull</text>
  <text x="670" y="556" text-anchor="middle" class="tiny">queue broker · not the ledger</text>

  <line x1="670" y1="572" x2="670" y2="608" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="560" y="608" width="220" height="44" rx="8" fill="#fff" stroke="#b45309" stroke-width="1.5"/>
  <text x="670" y="635" text-anchor="middle" class="label">Worker ’ DLQ</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>
